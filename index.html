<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turizm Test Portalı</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="home">
    <div class="app">
      <header class="home-hero">
        <p class="home-pill">Soru Bankası</p>
        <h1>Turizm Test Portalı</h1>
        <p>
          Ziyafet ve turizm konularına ait testleri seçerek hemen çözmeye
          başlayın. İlerleme durumunuz otomatik kaydedilir ve dilediğiniz zaman
          kaldığınız yerden devam edebilirsiniz.
        </p>
      </header>

      <div class="filter-section">
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">Tümü</button>
          <button class="filter-btn" data-filter="vize">Vize</button>
          <button class="filter-btn" data-filter="final">Final</button>
        </div>
      </div>

      <main id="tests" class="test-grid">
        <!-- Kartlar JavaScript ile dinamik olarak yüklenecek -->
      </main>
    </div>

    <script src="home.js"></script>
  </body>
</html>
